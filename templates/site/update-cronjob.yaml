{{- range .Values.sites }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ .name }}-sync"
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 120
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: "{{ .name }}-sync"
              image: rustfs/rc:latest
              command: ["/bin/sh", "-c", "/scripts/update.sh"]
              workingDir: /workdir
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: workdir
                  mountPath: /workdir
              env:
                {{ if $.Values.github.secret.name }}
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.github.secret.name }}
                      key: {{ $.Values.github.secret.key }}
                {{ end }}
                - name: STORAGE_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.rustfs.secret.existingSecret }}
                      key: RUSTFS_ACCESS_KEY
                - name: STORAGE_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.rustfs.secret.existingSecret }}
                      key: RUSTFS_SECRET_KEY
          volumes:
            - name: scripts
              configMap:
                name: "{{ .name }}-scripts"
                defaultMode: 0755
            - name: workdir
              emptyDir: {}
{{- end }}
